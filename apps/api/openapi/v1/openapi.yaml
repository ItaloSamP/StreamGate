openapi: 3.0.3
info:
  title: StreamGate API
  version: v1
  description: |
    Base inicial da documentacao OpenAPI do StreamGate.
    A Sprint 4 consolida runtime real de worker com RabbitMQ, camada materializada de analytics
    e leituras operacionais de quarantine/audit/DLQ.
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
tags:
  - name: Health
  - name: Auth
  - name: Uploads
  - name: Jobs
  - name: Analytics
  - name: Quarantine
  - name: Audit
  - name: Operations
  - name: Artifacts
  - name: Notifications
  - name: Realtime
  - name: Alerts
  - name: Connectors
paths:
  /up:
    get:
      summary: Health check da API
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: API disponivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /api/v1/auth/register:
    post:
      summary: Cadastro de usuario com sessao inicial
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Usuario criado e sessao iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/login:
    post:
      summary: Login com email e senha
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '401':
          description: Credencial invalida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/logout:
    post:
      summary: Revoga a sessao atual
      operationId: logoutUser
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao revogada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/session/refresh:
    post:
      summary: Renova sessao com rotacao de token
      operationId: refreshSession
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao renovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefreshEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/me:
    get:
      summary: Retorna sessao e usuario atuais
      operationId: currentSession
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponseEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/password/reset/request:
    post:
      summary: Solicita redefinicao de senha
      operationId: requestPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Requisicao processada sem enumeracao de usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/password/reset/confirm:
    post:
      summary: Confirma redefinicao de senha com token
      operationId: confirmPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          description: Token invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/uploads/signed-url:
    post:
      summary: Gera URL assinada para upload no storage
      operationId: generateSignedUploadUrl
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSignedUrlRequest'
      responses:
        '201':
          description: URL assinada gerada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSignedUrlEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Dependencia de storage indisponivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/uploads:
    post:
      summary: Registra upload e cria job inicial
      operationId: registerUploadAndCreateJob
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRegisterRequest'
      responses:
        '201':
          description: Upload registrado e job criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRegisterEnvelope'
        '200':
          description: Registro idempotente reaproveitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRegisterEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflito de storage_key/checksum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Dependencia de storage indisponivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: Lista uploads com filtros e paginacao
      operationId: listUploads
      tags:
        - Uploads
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Lista de uploads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadListEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filtros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/uploads/public-link:
    post:
      summary: Registra ingestao por link publico seguro
      operationId: createPublicLinkUpload
      tags:
        - Uploads
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicLinkRequest'
      responses:
        '201':
          description: Link publico registrado e evento de aquisicao enfileirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLinkEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Idempotency-Key usada com outro payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: URL bloqueada ou payload invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/jobs:
    get:
      summary: Lista jobs com filtros e paginacao
      operationId: listJobs
      tags:
        - Jobs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Lista de jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filtros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/analytics:
    get:
      summary: Leitura analitica operacional com KPIs e breakdowns
      operationId: listAnalytics
      tags:
        - Analytics
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: preset
          schema:
            type: string
            enum: [last_24h, last_7d, last_30d]
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: timezone
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [count, actor_id, status, source]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Snapshot analitico operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filtros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/analytics/dashboard:
    get:
      summary: Snapshot agregado da dashboard operacional
      operationId: showAnalyticsDashboard
      tags:
        - Analytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard com secoes live, derived, empty ou degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsDashboardEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/analytics/dashboard/exports:
    post:
      summary: Gera export auditavel da dashboard
      operationId: createAnalyticsDashboardExport
      tags:
        - Analytics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardExportRequest'
      responses:
        '201':
          description: Export gerado com conteudo inline e metadados persistidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardExportEnvelope'
        '403':
          description: Sem permissao para exportar dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload invalido ou Idempotency-Key ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/realtime/tickets:
    post:
      summary: Emite ticket curto para canal realtime
      operationId: createRealtimeTicket
      tags:
        - Realtime
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Ticket assinado por usuario, organizacao e role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicketEnvelope'
        '403':
          description: Sem permissao para realtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/realtime/events:
    get:
      summary: Fallback polling para eventos realtime duraveis
      operationId: listRealtimeEvents
      tags:
        - Realtime
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
      responses:
        '200':
          description: Eventos visiveis ao usuario atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeEventListEnvelope'
        '403':
          description: Sem permissao para realtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/alerts/{id}/review:
    post:
      summary: Marca alerta operacional como revisado
      operationId: reviewAlert
      tags:
        - Alerts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationActionRequest'
      responses:
        '200':
          description: Alerta revisado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActionEnvelope'

  /api/v1/alerts/{id}/dismiss:
    post:
      summary: Fecha alerta operacional com motivo auditavel
      operationId: dismissAlert
      tags:
        - Alerts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationActionRequest'
      responses:
        '200':
          description: Alerta fechado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActionEnvelope'

  /api/v1/connectors/profiles:
    get:
      summary: Lista perfis de conectores da organizacao atual
      operationId: listConnectorProfiles
      tags:
        - Connectors
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfis sem segredos nem bucket/key expostos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorProfileListEnvelope'
    post:
      summary: Cria perfil de conector admin-only
      operationId: createConnectorProfile
      tags:
        - Connectors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorProfileRequest'
      responses:
        '201':
          description: Perfil criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorProfileEnvelope'

  /api/v1/connectors/profiles/{id}:
    get:
      summary: Mostra um perfil de conector sem segredos
      operationId: showConnectorProfile
      tags:
        - Connectors
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Perfil mascarado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorProfileEnvelope'
    patch:
      summary: Atualiza um perfil de conector admin-only
      operationId: updateConnectorProfile
      tags:
        - Connectors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorProfileRequest'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorProfileEnvelope'

  /api/v1/connectors/profiles/{id}/test:
    post:
      summary: Valida configuracao persistida de um conector
      operationId: testConnectorProfile
      tags:
        - Connectors
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultado de teste de configuracao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorProfileTestEnvelope'

  /api/v1/connectors/profiles/{profile_id}/ingestions:
    post:
      summary: Solicita ingestao via conector e emite lease interno
      operationId: createConnectorIngestion
      tags:
        - Connectors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorIngestionRequest'
      responses:
        '201':
          description: Upload/job/ingestion criados e lease curto retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorIngestionEnvelope'

  /api/v1/internal/connectors/leases/{id}/claim:
    post:
      summary: Claim interno de lease de conector pelo worker
      operationId: claimConnectorLease
      tags:
        - Connectors
      parameters:
        - name: X-Worker-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Connector-Lease-Token
          in: header
          required: false
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lease:
                  type: object
                  properties:
                    token:
                      type: string
      responses:
        '200':
          description: Material minimo para o worker baixar e armazenar o objeto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorLeaseClaimEnvelope'

  /api/v1/analytics/warehouse:
    get:
      summary: Leitura analitica por warehouse com fallback honesto
      operationId: showAnalyticsWarehouse
      tags:
        - Analytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Leitura ClickHouse ou fallback postgres_derived com metadados de SLO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsWarehouseEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/analytics/lineage:
    get:
      summary: Drilldown de lineage tecnico por job
      operationId: showAnalyticsLineage
      tags:
        - Analytics
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: job_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lineage com batches, attempts, quarentena, artefatos, warnings e auditoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsLineageEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: job_id ausente ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/quarantine:
    get:
      summary: Lista registros de quarentena com filtros operacionais
      operationId: listQuarantine
      tags:
        - Quarantine
      security:
        - bearerAuth: []
      parameters:
        - in: query
