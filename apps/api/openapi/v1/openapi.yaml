openapi: 3.0.3
info:
  title: StreamGate API
  version: v1
  description: |
    Base inicial da documentacao OpenAPI do StreamGate.
    A Sprint 4 consolida runtime real de worker com RabbitMQ, camada materializada de analytics
    e leituras operacionais de quarantine/audit/DLQ.
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
tags:
  - name: Health
  - name: Auth
  - name: Uploads
  - name: Jobs
  - name: Analytics
  - name: Quarantine
  - name: Audit
  - name: Operations
  - name: Artifacts
  - name: Notifications
paths:
  /up:
    get:
      summary: Health check da API
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: API disponivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /api/v1/auth/register:
    post:
      summary: Cadastro de usuario com sessao inicial
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Usuario criado e sessao iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/login:
    post:
      summary: Login com email e senha
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '401':
          description: Credencial invalida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/logout:
    post:
      summary: Revoga a sessao atual
      operationId: logoutUser
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao revogada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/session/refresh:
    post:
      summary: Renova sessao com rotacao de token
      operationId: refreshSession
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao renovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefreshEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/me:
    get:
      summary: Retorna sessao e usuario atuais
      operationId: currentSession
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponseEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/password/reset/request:
    post:
      summary: Solicita redefinicao de senha
      operationId: requestPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Requisicao processada sem enumeracao de usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/password/reset/confirm:
    post:
      summary: Confirma redefinicao de senha com token
      operationId: confirmPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          description: Token invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/uploads/signed-url:
    post:
      summary: Gera URL assinada para upload no storage
      operationId: generateSignedUploadUrl
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSignedUrlRequest'
      responses:
        '201':
          description: URL assinada gerada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSignedUrlEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Dependencia de storage indisponivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/uploads:
    post:
      summary: Registra upload e cria job inicial
      operationId: registerUploadAndCreateJob
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRegisterRequest'
      responses:
        '201':
          description: Upload registrado e job criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRegisterEnvelope'
        '200':
          description: Registro idempotente reaproveitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRegisterEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflito de storage_key/checksum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Dependencia de storage indisponivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: Lista uploads com filtros e paginacao
      operationId: listUploads
      tags:
        - Uploads
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Lista de uploads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadListEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filtros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/jobs:
    get:
      summary: Lista jobs com filtros e paginacao
      operationId: listJobs
      tags:
        - Jobs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Lista de jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filtros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/analytics:
    get:
      summary: Leitura analitica operacional com KPIs e breakdowns
      operationId: listAnalytics
      tags:
        - Analytics
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: preset
          schema:
            type: string
            enum: [last_24h, last_7d, last_30d]
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: timezone
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [count, actor_id, status, source]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Snapshot analitico operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filtros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/quarantine:
    get:
      summary: Lista registros de quarentena com filtros operacionais
      operationId: listQuarantine
      tags:
        - Quarantine
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: preset
          schema:
            type: string
            enum: [last_24h, last_7d, last_30d]
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: timezone
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
            enum: [warning, error]
        - in: query
          name: job_id
          schema:
            type: string
        - in: query
          name: trace_id
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [created_at, severity, row_number, code]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista de quarentena
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineListEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filtros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/quarantine/dlq:
    get:
      summary: Inspecao read-only da DLQ de upload.received.v1
      operationId: inspectUploadDlq
      tags:
        - Quarantine
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: dead_letter_reason
          schema:
            type: string
        - in: query
          name: event_name
          schema:
            type: string
        - in: query
          name: trace_id
          schema:
            type: string
        - in: query
          name: job_id
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [retry_count, dead_letter_reason, event_id, occurred_at]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Snapshot de mensagens presentes na DLQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqListEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filtros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Dependencia indisponivel no broker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/audit:
    get:
      summary: Lista trilha de auditoria operacional
      operationId: listAuditEvents
      tags:
        - Audit
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: preset
          schema:
            type: string
            enum: [last_24h, last_7d, last_30d]
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: timezone
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: actor_id
          schema:
            type: string
        - in: query
          name: auditable_type
          schema:
            type: string
        - in: query
          name: trace_id
          schema:
            type: string
        - in: query
          name: request_id
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [occurred_at, action, actor_id, auditable_type]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista de eventos de auditoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filtros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/jobs/{job_id}/retry:
    post:
      summary: Solicita retry operacional de um job
      operationId: retryJob
      tags: [Operations]
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationActionRequest'
      responses:
        '202':
          description: Retry solicitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationActionResponseEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Estado invalido ou idempotency key ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Idempotency key reutilizada com payload divergente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/quarantine/{quarantine_id}/resolve:
    post:
      summary: Resolve um registro de quarentena
      operationId: resolveQuarantine
      tags: [Operations]
      parameters:
        - $ref: '#/components/parameters/QuarantineIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationActionRequest'
      responses:
        '200':
          description: Registro resolvido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineResolveResponseEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Estado invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/quarantine/dlq/{message_id}/replay-requests:
    post:
      summary: Cria solicitacao de replay de mensagem da DLQ
      operationId: createDlqReplayRequest
      tags: [Operations]
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqReplayRequestCreateRequest'
      responses:
        '201':
          description: Solicitacao criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqReplayRequestResponseEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/dlq-replay-requests/{id}/approve:
    post:
      summary: Aprova solicitacao de replay de DLQ
      operationId: approveDlqReplayRequest
      tags: [Operations]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationActionRequest'
      responses:
        '200':
          description: Solicitacao aprovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqReplayRequestResponseEnvelope'
        '403':
          description: Acesso negado ou self-approval bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/dlq-replay-requests/{id}/execute:
    post:
      summary: Executa replay aprovado de DLQ
      operationId: executeDlqReplayRequest
      tags: [Operations]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationActionRequest'
      responses:
        '202':
          description: Replay executado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqReplayRequestResponseEnvelope'
        '422':
          description: Solicitacao nao aprovada ou payload invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/jobs/{job_id}/artifacts:
    get:
      summary: Lista artefatos finais de um job
      operationId: listJobArtifacts
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Artefatos do job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponseEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/jobs/{job_id}/artifacts/{artifact_id}/download-url:
    post:
      summary: Gera URL assinada curta para download de artefato
      operationId: createArtifactDownloadUrl
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: URL assinada gerada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDownloadUrlResponseEnvelope'

  /api/v1/notifications:
    get:
      summary: Lista notificacoes in-app do usuario atual
      operationId: listNotifications
      tags: [Notifications]
      responses:
        '200':
          description: Notificacoes do usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponseEnvelope'

  /api/v1/notification-settings:
    get:
      summary: Consulta configuracoes de notificacao
      operationId: getNotificationSettings
      tags: [Notifications]
      responses:
        '200':
          description: Configuracoes atuais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponseEnvelope'
    patch:
      summary: Atualiza configuracoes de notificacao
      operationId: updateNotificationSettings
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsUpdateRequest'
      responses:
        '200':
          description: Configuracoes atualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponseEnvelope'

  /api/v1/notification-settings/webhook/test:
    post:
      summary: Cria delivery de teste para webhook
      operationId: testWebhookNotification
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationActionRequest'
      responses:
        '202':
          description: Delivery de teste criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryResponseEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Chave obrigatoria para deduplicar mutacoes sensiveis.
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    QuarantineIdPath:
      name: quarantine_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthCheckResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    SuccessEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          description: Payload principal do recurso ou colecao.
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    MessageEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Operacao concluida com sucesso.
            revoked:
              type: boolean

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
            - trace_id
            - correlation_id
          properties:
            code:
              type: string
              description: Codigo estavel de erro para contrato com cliente.
              enum:
                - validation_failed
                - invalid_credentials
                - access_denied
                - session_expired
                - rate_limited
                - resource_conflict
                - dependency_unavailable
                - not_found
              example: validation_failed
            message:
              type: string
              example: Nao foi possivel concluir a operacao solicitada.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              example: req_12cbaf4c14bb49cf8f6497a38e8d673b
            trace_id:
              type: string
              example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8
            correlation_id:
              type: string
              example: req_12cbaf4c14bb49cf8f6497a38e8d673b

    ErrorDetail:
      type: object
      required:
        - reason
      properties:
        field:
          type: string
          example: email
        reason:
          type: string
          example: invalid

    EnvelopeMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        filters:
          $ref: '#/components/schemas/FilterMeta'

    PaginationMeta:
      type: object
      required:
        - page
        - per_page
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        per_page:
          type: integer
          minimum: 1
          example: 20
        total_count:
          type: integer
          minimum: 0
          example: 48
        total_pages:
          type: integer
          minimum: 0
          example: 3

    FilterMeta:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
          - type: 'null'

    RegistrationRequest:
      type: object
      required:
        - registration
      properties:
        registration:
          type: object
          required:
            - full_name
            - email
            - password
            - password_confirmation
          properties:
            full_name:
              type: string
              example: StreamGate Operator
            email:
              type: string
              format: email
              example: operator@streamgate.local
            password:
              type: string
              format: password
              example: StrongPass123!
            password_confirmation:
              type: string
              format: password
              example: StrongPass123!

    LoginRequest:
      type: object
      required:
        - session
      properties:
        session:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: operator@streamgate.local
            password:
              type: string
              format: password
              example: StrongPass123!

    PasswordResetRequest:
      type: object
      required:
        - password_reset
      properties:
        password_reset:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email

    PasswordResetConfirmRequest:
      type: object
      required:
        - password_reset_confirmation
      properties:
        password_reset_confirmation:
          type: object
          required:
            - token
            - password
            - password_confirmation
          properties:
            token:
              type: string
            password:
              type: string
              format: password
            password_confirmation:
              type: string
              format: password

    User:
      type: object
      required:
        - id
        - email
        - full_name
        - organization_id
        - role
        - status
      properties:
        id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        email:
          type: string
          format: email
          example: operator@streamgate.local
        full_name:
          type: string
          example: StreamGate Operator
        organization_id:
          type: string
          example: org_streamgate
        role:
          type: string
          enum:
            - operator
            - admin
            - service_account
        status:
          type: string
          enum:
            - invited
            - active
            - suspended
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthSession:
      type: object
      required:
        - id
        - user_id
        - expires_at
        - trace_id
      properties:
        id:
          type: string
          example: sess_7fdbe4f4c8ce4020a18dc89f23d641fe
        user_id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        trace_id:
          type: string
          example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthToken:
      type: object
      required:
        - id
        - token_type
        - access_token
        - expires_at
      properties:
        id:
          type: string
          example: sess_7fdbe4f4c8ce4020a18dc89f23d641fe
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: 6ZnqYYAS8X9YQhY9VmcP2rGquk3xvyy6zIP6ZjfrEqw
        expires_at:
          type: string
          format: date-time

    AuthPayload:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/AuthToken'

    AuthResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AuthPayload'

    MePayload:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/AuthSession'

    MeResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MePayload'

    SessionRefreshPayload:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/AuthToken'

    SessionRefreshEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/SessionRefreshPayload'


    UploadSignedUrlRequest:
      type: object
      required:
        - upload
      properties:
        upload:
          type: object
          required:
            - filename
            - content_type
            - byte_size
            - checksum_sha256
          properties:
            filename:
              type: string
            content_type:
              type: string
              enum:
                - application/zip
                - text/csv
            byte_size:
              type: integer
              minimum: 1
            checksum_sha256:
              type: string
              pattern: '^[a-f0-9]{64}$'

    UploadSignedUrlPayload:
      type: object
      required:
        - storage_key
        - method
        - upload_url
        - required_headers
        - expires_at
      properties:
        storage_key:
          type: string
          example: uploads/user_abc/2026/04/07/token-orders.csv
        method:
          type: string
          example: PUT
        upload_url:
          type: string
          format: uri
        required_headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time

    UploadSignedUrlEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/UploadSignedUrlPayload'

    UploadRegisterRequest:
      type: object
      required:
        - upload
      properties:
        upload:
          type: object
          required:
            - filename
            - content_type
            - byte_size
            - checksum_sha256
            - storage_key
          properties:
            filename:
              type: string
            content_type:
              type: string
              enum:
                - application/zip
                - text/csv
            byte_size:
              type: integer
              minimum: 1
            checksum_sha256:
              type: string
              pattern: '^[a-f0-9]{64}$'
            storage_key:
              type: string
              example: uploads/user_abc/2026/04/07/token-orders.csv
            metadata:
              type: object
              additionalProperties: true

    UploadRegisterPayload:
      type: object
      required:
        - upload
        - job
      properties:
        upload:
          $ref: '#/components/schemas/Upload'
        job:
          $ref: '#/components/schemas/Job'

    UploadRegisterMeta:
      type: object
      properties:
        idempotent:
          type: boolean

    UploadRegisterEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/UploadRegisterPayload'
        meta:
          $ref: '#/components/schemas/UploadRegisterMeta'

    UploadListEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Upload'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    JobListEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
    QuarantineListEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuarantineRecord'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    AuditListEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    DlqListEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DlqMessage'
        meta:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
            queue:
              type: object
              properties:
                name:
                  type: string
                queue_depth:
                  type: integer
            filters:
              $ref: '#/components/schemas/FilterMeta'

    AnalyticsEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AnalyticsPayload'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
    Upload:
      type: object
      required:
        - id
        - filename
        - content_type
        - byte_size
        - checksum_sha256
        - storage_key
        - status
        - sensitivity_level
        - user_id
        - trace_id
      properties:
        id:
          type: string
          example: upload_52dc1cd9d40c472ebd63408d8d7b866f
        filename:
          type: string
          example: sample-import.csv
        content_type:
          type: string
          example: text/csv
        byte_size:
          type: integer
          minimum: 1
          example: 2048
        checksum_sha256:
          type: string
          example: 4f16e1f2e91c3b6b8fdd8d4ac6b6ac1ac3d6f68b0c4d9843791d7c7f7c6b5a3a
        storage_key:
          type: string
          example: uploads/sample-import.csv
        status:
          type: string
          enum:
            - registered
            - stored
            - processing
            - completed
            - failed
            - quarantined
        sensitivity_level:
          type: string
          enum:
            - internal
            - restricted
        user_id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        trace_id:
          type: string
          example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Job:
      type: object
      required:
        - id
        - upload_id
        - requested_by_id
        - source_type
        - status
        - quarantined_records_count
        - trace_id
      properties:
        id:
          type: string
          example: job_6f51b476d7274d6d94c7943ee6d88515
        upload_id:
          type: string
          example: upload_52dc1cd9d40c472ebd63408d8d7b866f
        requested_by_id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        source_type:
          type: string
          example: upload
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - quarantined_with_warnings
        error_code:
          type: string
          nullable: true
        error_category:
          type: string
          nullable: true
        quarantined_records_count:
          type: integer
          minimum: 0
        trace_id:
          type: string
          example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QuarantineRecord:
      type: object
      required:
        - id
        - job_id
        - severity
        - code
        - message
        - trace_id
      properties:
        id:
          type: string
        job_id:
          type: string
        job_batch_id:
          type: string
          nullable: true
        severity:
          type: string
          enum: [warning, error]
        code:
          type: string
        message:
          type: string
        row_number:
          type: integer
          nullable: true
        payload:
          description: Payload operacional com chaves sensiveis mascaradas como `[REDACTED]`.
          type: object
          additionalProperties: true
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuditEvent:
      type: object
      required:
        - id
        - action
        - auditable_type
        - auditable_id
        - request_id
        - trace_id
        - occurred_at
      properties:
        id:
          type: string
        action:
          type: string
        actor_id:
          type: string
          nullable: true
        auditable_type:
          type: string
        auditable_id:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        metadata:
          description: Metadata de auditoria sanitizada por allowlist; chaves fora do contrato sao mascaradas.
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DlqMessage:
      type: object
      required:
        - payload
        - routing_key
        - retry_count
        - headers
      properties:
        payload:
          description: Snapshot do payload na DLQ com chaves sensiveis mascaradas como `[REDACTED]`.
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
        exchange:
          type: string
        routing_key:
          type: string
        redelivered:
          type: boolean
        retry_count:
          type: integer
          minimum: 0
        dead_letter_reason:
          type: string
          nullable: true
        headers:
          description: Headers da mensagem sanitizados antes da exposicao pela API.
          type: object
          additionalProperties: true

    AnalyticsPayload:
      type: object
      required:
        - window
        - kpis
        - breakdowns
      properties:
        window:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            preset:
              type: string
              nullable: true
            timezone:
              type: string
        kpis:
          type: object
          required:
            - uploads_total
            - jobs_total
            - jobs_processing
            - jobs_completed
            - jobs_failed
            - jobs_quarantined
            - quarantine_records_total
            - audit_events_total
          properties:
            uploads_total:
              type: integer
            jobs_total:
              type: integer
            jobs_processing:
              type: integer
            jobs_completed:
              type: integer
            jobs_failed:
              type: integer
            jobs_quarantined:
              type: integer
            quarantine_records_total:
              type: integer
            audit_events_total:
              type: integer
        breakdowns:
          type: object
          properties:
            status:
              type: array
              items:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
            actor:
              type: array
              items:
                type: object
                properties:
                  actor_id:
                    type: string
                  count:
                    type: integer
            source:
              type: array
              items:
                type: object
                properties:
                  source:
                    type: string
                  count:
                    type: integer

    OperationActionRequest:
      type: object
      required: [operation]
      properties:
        operation:
          type: object
          required: [reason]
          properties:
            reason:
              type: string
              minLength: 1
              maxLength: 500

    OperationActionResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            job_id: { type: string }
            status: { type: string }
            attempt_id: { type: string }
            outbox_id: { type: string }

    QuarantineResolveResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            job_id: { type: string }
            resolution_status: { type: string, enum: [open, resolved] }
            resolution_reason: { type: string }
            resolved_by_id: { type: string }
            resolved_at: { type: string, format: date-time }

    DlqReplayRequestCreateRequest:
      type: object
      required: [operation]
      properties:
        operation:
          type: object
          required: [reason, payload]
          properties:
            reason: { type: string, minLength: 1, maxLength: 500 }
            payload:
              type: object

    DlqReplayRequestResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DlqReplayRequest'

    DlqReplayRequest:
      type: object
      properties:
        id: { type: string }
        message_id: { type: string }
        status: { type: string, enum: [requested, approved, executing, executed, rejected, failed] }
        requested_by_id: { type: string }
        approved_by_id: { type: string, nullable: true }
        executed_by_id: { type: string, nullable: true }
        reason: { type: string }
        approved_at: { type: string, format: date-time, nullable: true }
        executed_at: { type: string, format: date-time, nullable: true }
        outbox_event_id: { type: string, nullable: true }
        trace_id: { type: string }

    ArtifactListResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobArtifact'

    JobArtifact:
      type: object
      properties:
        id: { type: string }
        job_id: { type: string }
        artifact_type: { type: string, enum: [processed_dataset, quality_report, audit_report] }
        status: { type: string, enum: [pending, generating, available, failed, expired] }
        filename: { type: string }
        content_type: { type: string }
        byte_size: { type: integer, minimum: 0 }
        checksum_sha256: { type: string, nullable: true }
        generated_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        trace_id: { type: string }

    ArtifactDownloadUrlResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            artifact_id: { type: string }
            download_url: { type: string, format: uri }
            expires_at: { type: string, format: date-time }

    NotificationListResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

    Notification:
      type: object
      properties:
        id: { type: string }
        event_name: { type: string }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [unread, read, archived] }
        read_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        trace_id: { type: string }

    NotificationSettingsUpdateRequest:
      type: object
      required: [notification_setting]
      properties:
        notification_setting:
          type: object
          properties:
            in_app_enabled: { type: boolean }
            email_enabled: { type: boolean }
            webhook_enabled: { type: boolean }
            webhook_url: { type: string, format: uri }

    NotificationSettingsResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
