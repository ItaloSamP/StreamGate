openapi: 3.0.3
info:
  title: StreamGate API
  version: v1
  description: |
    Base inicial da documentacao OpenAPI do StreamGate.
    A Sprint 2 consolida autenticacao real, sessao e endpoint `me`.
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
tags:
  - name: Health
  - name: Auth
paths:
  /up:
    get:
      summary: Health check da API
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: API disponivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /api/v1/auth/register:
    post:
      summary: Cadastro de usuario com sessao inicial
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Usuario criado e sessao iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/login:
    post:
      summary: Login com email e senha
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '401':
          description: Credencial invalida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/logout:
    post:
      summary: Revoga a sessao atual
      operationId: logoutUser
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao revogada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/session/refresh:
    post:
      summary: Renova sessao com rotacao de token
      operationId: refreshSession
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao renovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefreshEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/me:
    get:
      summary: Retorna sessao e usuario atuais
      operationId: currentSession
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponseEnvelope'
        '401':
          description: Sessao expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/password/reset/request:
    post:
      summary: Solicita redefinicao de senha
      operationId: requestPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Requisicao processada sem enumeracao de usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/password/reset/confirm:
    post:
      summary: Confirma redefinicao de senha com token
      operationId: confirmPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          description: Token invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de tentativas excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  schemas:
    HealthCheckResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    SuccessEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          description: Payload principal do recurso ou colecao.
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    MessageEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Operacao concluida com sucesso.
            revoked:
              type: boolean

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
            - trace_id
          properties:
            code:
              type: string
              description: Codigo estavel de erro para contrato com cliente.
              enum:
                - validation_failed
                - invalid_credentials
                - access_denied
                - session_expired
                - rate_limited
                - not_found
              example: validation_failed
            message:
              type: string
              example: Nao foi possivel concluir a operacao solicitada.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              example: req_12cbaf4c14bb49cf8f6497a38e8d673b
            trace_id:
              type: string
              example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8

    ErrorDetail:
      type: object
      required:
        - reason
      properties:
        field:
          type: string
          example: email
        reason:
          type: string
          example: invalid

    EnvelopeMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        filters:
          $ref: '#/components/schemas/FilterMeta'

    PaginationMeta:
      type: object
      required:
        - page
        - per_page
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        per_page:
          type: integer
          minimum: 1
          example: 20
        total_count:
          type: integer
          minimum: 0
          example: 48
        total_pages:
          type: integer
          minimum: 0
          example: 3

    FilterMeta:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
          - type: 'null'

    RegistrationRequest:
      type: object
      required:
        - registration
      properties:
        registration:
          type: object
          required:
            - full_name
            - email
            - password
            - password_confirmation
          properties:
            full_name:
              type: string
              example: StreamGate Operator
            email:
              type: string
              format: email
              example: operator@streamgate.local
            password:
              type: string
              format: password
              example: StrongPass123!
            password_confirmation:
              type: string
              format: password
              example: StrongPass123!

    LoginRequest:
      type: object
      required:
        - session
      properties:
        session:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: operator@streamgate.local
            password:
              type: string
              format: password
              example: StrongPass123!

    PasswordResetRequest:
      type: object
      required:
        - password_reset
      properties:
        password_reset:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email

    PasswordResetConfirmRequest:
      type: object
      required:
        - password_reset_confirmation
      properties:
        password_reset_confirmation:
          type: object
          required:
            - token
            - password
            - password_confirmation
          properties:
            token:
              type: string
            password:
              type: string
              format: password
            password_confirmation:
              type: string
              format: password

    User:
      type: object
      required:
        - id
        - email
        - full_name
        - role
        - status
      properties:
        id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        email:
          type: string
          format: email
          example: operator@streamgate.local
        full_name:
          type: string
          example: StreamGate Operator
        role:
          type: string
          enum:
            - operator
            - admin
            - service_account
        status:
          type: string
          enum:
            - invited
            - active
            - suspended
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthSession:
      type: object
      required:
        - id
        - user_id
        - expires_at
        - trace_id
      properties:
        id:
          type: string
          example: sess_7fdbe4f4c8ce4020a18dc89f23d641fe
        user_id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        trace_id:
          type: string
          example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthToken:
      type: object
      required:
        - id
        - token_type
        - access_token
        - expires_at
      properties:
        id:
          type: string
          example: sess_7fdbe4f4c8ce4020a18dc89f23d641fe
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: 6ZnqYYAS8X9YQhY9VmcP2rGquk3xvyy6zIP6ZjfrEqw
        expires_at:
          type: string
          format: date-time

    AuthPayload:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/AuthToken'

    AuthResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AuthPayload'

    MePayload:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/AuthSession'

    MeResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MePayload'

    SessionRefreshPayload:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/AuthToken'

    SessionRefreshEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/SessionRefreshPayload'

    Upload:
      type: object
      required:
        - id
        - filename
        - content_type
        - byte_size
        - checksum_sha256
        - storage_key
        - status
        - sensitivity_level
        - user_id
        - trace_id
      properties:
        id:
          type: string
          example: upload_52dc1cd9d40c472ebd63408d8d7b866f
        filename:
          type: string
          example: sample-import.csv
        content_type:
          type: string
          example: text/csv
        byte_size:
          type: integer
          minimum: 1
          example: 2048
        checksum_sha256:
          type: string
          example: 4f16e1f2e91c3b6b8fdd8d4ac6b6ac1ac3d6f68b0c4d9843791d7c7f7c6b5a3a
        storage_key:
          type: string
          example: uploads/sample-import.csv
        status:
          type: string
          enum:
            - registered
            - stored
            - processing
            - completed
            - failed
            - quarantined
        sensitivity_level:
          type: string
          enum:
            - internal
            - restricted
        user_id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        trace_id:
          type: string
          example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Job:
      type: object
      required:
        - id
        - upload_id
        - requested_by_id
        - source_type
        - status
        - quarantined_records_count
        - trace_id
      properties:
        id:
          type: string
          example: job_6f51b476d7274d6d94c7943ee6d88515
        upload_id:
          type: string
          example: upload_52dc1cd9d40c472ebd63408d8d7b866f
        requested_by_id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        source_type:
          type: string
          example: upload
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - quarantined_with_warnings
        error_code:
          type: string
          nullable: true
        error_category:
          type: string
          nullable: true
        quarantined_records_count:
          type: integer
          minimum: 0
        trace_id:
          type: string
          example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

