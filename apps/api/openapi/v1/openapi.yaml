components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Chave obrigatoria para deduplicar mutacoes sensiveis.
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    QuarantineIdPath:
      name: quarantine_id
      in: path
      required: true
      schema:
        type: string
    NotificationIdPath:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthCheckResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    SuccessEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          description: Payload principal do recurso ou colecao.
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    MessageEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Operacao concluida com sucesso.
            revoked:
              type: boolean

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
            - trace_id
            - correlation_id
          properties:
            code:
              type: string
              description: Codigo estavel de erro para contrato com cliente.
              enum:
                - validation_failed
                - invalid_credentials
                - access_denied
                - session_expired
                - rate_limited
                - resource_conflict
                - dependency_unavailable
                - not_found
              example: validation_failed
            message:
              type: string
              example: Nao foi possivel concluir a operacao solicitada.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              example: req_12cbaf4c14bb49cf8f6497a38e8d673b
            trace_id:
              type: string
              example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8
            correlation_id:
              type: string
              example: req_12cbaf4c14bb49cf8f6497a38e8d673b

    ErrorDetail:
      type: object
      required:
        - reason
      properties:
        field:
          type: string
          example: email
        reason:
          type: string
          example: invalid

    EnvelopeMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        filters:
          $ref: '#/components/schemas/FilterMeta'

    PaginationMeta:
      type: object
      required:
        - page
        - per_page
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        per_page:
          type: integer
          minimum: 1
          example: 20
        total_count:
          type: integer
          minimum: 0
          example: 48
        total_pages:
          type: integer
          minimum: 0
          example: 3

    FilterMeta:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
          - type: 'null'

    RegistrationRequest:
      type: object
      required:
        - registration
      properties:
        registration:
          type: object
          required:
            - full_name
            - email
            - password
            - password_confirmation
          properties:
            full_name:
              type: string
              example: StreamGate Operator
            email:
              type: string
              format: email
              example: operator@streamgate.local
            password:
              type: string
              format: password
              example: StrongPass123!
            password_confirmation:
              type: string
              format: password
              example: StrongPass123!

    LoginRequest:
      type: object
      required:
        - session
      properties:
        session:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: operator@streamgate.local
            password:
              type: string
              format: password
              example: StrongPass123!

    PasswordResetRequest:
      type: object
      required:
        - password_reset
      properties:
        password_reset:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email

    PasswordResetConfirmRequest:
      type: object
      required:
        - password_reset_confirmation
      properties:
        password_reset_confirmation:
          type: object
          required:
            - token
            - password
            - password_confirmation
          properties:
            token:
              type: string
            password:
              type: string
              format: password
            password_confirmation:
              type: string
              format: password

    User:
      type: object
      required:
        - id
        - email
        - full_name
        - organization_id
        - role
        - status
      properties:
        id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        email:
          type: string
          format: email
          example: operator@streamgate.local
        full_name:
          type: string
          example: StreamGate Operator
        organization_id:
          type: string
          example: org_streamgate
        role:
          type: string
          enum:
            - operator
            - admin
            - service_account
        status:
          type: string
          enum:
            - invited
            - active
            - suspended
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthSession:
      type: object
      required:
        - id
        - user_id
        - expires_at
        - trace_id
      properties:
        id:
          type: string
          example: sess_7fdbe4f4c8ce4020a18dc89f23d641fe
        user_id:
          type: string
          example: user_6c561be0f4f24b2db15c0ddfd4e0d3c2
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        trace_id:
          type: string
          example: trace_3c3b72fe95be45e48dcc9f944d5fb6d8
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthToken:
      type: object
      required:
        - id
        - token_type
        - access_token
        - expires_at
      properties:
        id:
          type: string
          example: sess_7fdbe4f4c8ce4020a18dc89f23d641fe
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: 6ZnqYYAS8X9YQhY9VmcP2rGquk3xvyy6zIP6ZjfrEqw
        expires_at:
          type: string
          format: date-time

    AuthPayload:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/AuthToken'

    AuthResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AuthPayload'

    MePayload:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/AuthSession'

    MeResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MePayload'

    SessionRefreshPayload:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/AuthToken'

    SessionRefreshEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/SessionRefreshPayload'


    UploadSignedUrlRequest:
      type: object
      required:
        - upload
      properties:
        upload:
          type: object
          required:
            - filename
            - content_type
            - byte_size
            - checksum_sha256
          properties:
            filename:
              type: string
            content_type:
              type: string
              enum:
                - application/json
                - application/zip
                - application/x-ndjson
                - application/ndjson
                - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
