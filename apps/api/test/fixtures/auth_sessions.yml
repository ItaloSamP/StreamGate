operator_active_session:
  id: sess_fixture_operator_active
  user_id: user_fixture_operator
  token_digest: fixture_token_digest_operator
  expires_at: <%= 2.days.from_now %>
  revoked_at:
  last_seen_at: <%= 30.minutes.ago %>
  request_id: req_fixture_operator
  trace_id: trace_fixture_operator
  ip_address: 127.0.0.1
  user_agent: fixture-agent
  created_at: <%= Time.current %>
  updated_at: <%= Time.current %>

admin_revoked_session:
  id: sess_fixture_admin_revoked
  user_id: user_fixture_admin
  token_digest: fixture_token_digest_admin
  expires_at: <%= 2.days.from_now %>
  revoked_at: <%= 1.hour.ago %>
  last_seen_at: <%= 2.hours.ago %>
  request_id: req_fixture_admin
  trace_id: trace_fixture_admin
  ip_address: 127.0.0.1
  user_agent: fixture-agent
  created_at: <%= Time.current %>
  updated_at: <%= Time.current %>

