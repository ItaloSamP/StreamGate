name: docker-ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install helper dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare env file
        run: cp .env.example .env

      - name: Validate compose default config
        run: docker compose -f compose.yaml config

      - name: Validate compose full profile
        run: docker compose -f compose.yaml --profile full config

      - name: Validate WSL bash health helpers
        run: bash scripts/compose-health-tests.sh

      - name: Validate PowerShell health helpers
        shell: pwsh
        run: ./scripts/compose-health.tests.ps1

      - name: Build API production image
        run: docker build -t streamgate-api:ci ./apps/api

      - name: Build API development image
        run: docker build -f apps/api/Dockerfile.dev -t streamgate-api-dev:ci ./apps/api

      - name: Build Web production image
        run: docker build -t streamgate-web:ci ./apps/web

      - name: Build Web development image
        run: docker build -f apps/web/Dockerfile.dev -t streamgate-web-dev:ci ./apps/web

      - name: Build Worker development image
        run: docker build -f apps/worker/Dockerfile.dev -t streamgate-worker-dev:ci ./apps/worker

      - name: Smoke test infra profile
        run: |
          docker compose up -d
          python - <<'PY'
          import json
          import subprocess
          import time

          deadline = time.time() + 180
          expected = {
              'postgres': ('running', 'healthy'),
              'redis': ('running', 'healthy'),
              'rabbitmq': ('running', 'healthy'),
              'minio': ('running', 'healthy'),
              'clickhouse': ('running', 'healthy'),
              'minio-init': ('exited', ''),
          }

          last = []
          while time.time() < deadline:
              raw = subprocess.check_output(['docker', 'compose', 'ps', '--format', 'json'], text=True).strip()
              if not raw:
                  time.sleep(5)
                  continue

              services = json.loads(raw)
              if isinstance(services, dict):
                  services = [services]

              seen = {service['Service']: service for service in services}
              missing = [name for name in expected if name not in seen]
              if missing:
                  last = [f'missing service {name}' for name in missing]
                  time.sleep(5)
                  continue

              errors = []
              for name, (state, health) in expected.items():
                  current = seen[name]
                  if current.get('State') != state:
                      errors.append(f"service {name} expected state {state}, got {current.get('State')}")
                      continue
                  if health and current.get('Health') != health:
                      errors.append(f"service {name} expected health {health}, got {current.get('Health')}")
                      continue
                  if name == 'minio-init' and int(current.get('ExitCode', 1)) != 0:
                      errors.append('minio-init did not exit successfully')
              if not errors:
                  print('compose smoke test passed')
                  raise SystemExit(0)
              last = errors
              time.sleep(5)

          raise SystemExit('compose smoke test failed: ' + '; '.join(last))
          PY
          docker compose ps

      - name: Stop compose stack
        if: always()
        run: docker compose down -v
