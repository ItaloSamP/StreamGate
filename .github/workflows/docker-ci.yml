name: docker-ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install helper dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare env file
        run: cp .env.example .env

      - name: Validate compose default config
        run: docker compose -f compose.yaml config

      - name: Validate compose full profile
        run: docker compose -f compose.yaml --profile full config

      - name: Validate WSL bash health helpers
        run: bash scripts/compose/compose-health-tests.sh

      - name: Validate PowerShell health helpers
        shell: pwsh
        run: ./scripts/compose/compose-health.tests.ps1

      - name: Build API production image
        run: docker build -t streamgate-api:ci ./apps/api

      - name: Build API development image
        run: docker build -f apps/api/Dockerfile.dev -t streamgate-api-dev:ci ./apps/api

      - name: Build Web production image
        run: docker build -t streamgate-web:ci ./apps/web

      - name: Build Web development image
        run: docker build -f apps/web/Dockerfile.dev -t streamgate-web-dev:ci ./apps/web

      - name: Build Worker development image
        run: docker build -f apps/worker/Dockerfile.dev -t streamgate-worker-dev:ci ./apps/worker

      - name: Run all smoke tests
        env:
          SMOKE_PUBLIC_LINK_URL: https://raw.githubusercontent.com/plotly/datasets/master/2014_apple_stock.csv
        run: |
          echo MINIO_CORS_ALLOWED_ORIGIN=http://localhost:5173 >> .env
          bash scripts/smokes/run-smokes.sh

      - name: Stop compose stack
        if: always()
        run: docker compose down -v
