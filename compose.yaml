name: streamgate

services:
  postgres:
    image: postgres:16
    container_name: streamgate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - streamgate

  redis:
    image: redis:7-alpine
    container_name: streamgate-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - streamgate

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: streamgate-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - streamgate

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: streamgate-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - streamgate

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: streamgate-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -eu -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET_RAW};
      mc anonymous set private local/${MINIO_BUCKET_RAW};
      "
    networks:
      - streamgate

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: streamgate-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - streamgate

  api:
    profiles: ["app", "full"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: streamgate-api
    restart: unless-stopped
    init: true
    working_dir: /app
    command: >
      bash -lc "
      bundle exec rails db:prepare &&
      exec bundle exec rails server -b 0.0.0.0 -p 3000
      "
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-24}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-30}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:-streamgate-local-dev-pepper}
      AUTH_SESSION_TRANSPORT: ${AUTH_SESSION_TRANSPORT:-bearer}
      AUTH_COOKIE_ENABLED: ${AUTH_COOKIE_ENABLED:-false}
      AUTH_CSRF_MODE: ${AUTH_CSRF_MODE:-token}
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      API_CORS_ALLOW_CREDENTIALS: ${API_CORS_ALLOW_CREDENTIALS:-false}
      UPLOAD_STORAGE_ENDPOINT: ${UPLOAD_STORAGE_ENDPOINT:-http://minio:9000}
      UPLOAD_STORAGE_BUCKET: ${UPLOAD_STORAGE_BUCKET:-streamgate-uploads}
      UPLOAD_STORAGE_REGION: ${UPLOAD_STORAGE_REGION:-us-east-1}
      UPLOAD_STORAGE_ACCESS_KEY: ${UPLOAD_STORAGE_ACCESS_KEY}
      UPLOAD_STORAGE_SECRET_KEY: ${UPLOAD_STORAGE_SECRET_KEY}
      UPLOAD_ALLOWED_CONTENT_TYPES: ${UPLOAD_ALLOWED_CONTENT_TYPES}
      UPLOAD_SIGNED_URL_TTL_SECONDS: ${UPLOAD_SIGNED_URL_TTL_SECONDS:-900}
      UPLOAD_SIGNED_URL_MODE: ${UPLOAD_SIGNED_URL_MODE:-presigned_put}
      UPLOAD_SIGNED_URL_LIMIT_PER_IP: ${UPLOAD_SIGNED_URL_LIMIT_PER_IP}
      UPLOAD_REGISTER_LIMIT_PER_IP: ${UPLOAD_REGISTER_LIMIT_PER_IP}
      UPLOAD_THROTTLE_WINDOW_SECONDS: ${UPLOAD_THROTTLE_WINDOW_SECONDS}
      UPLOAD_VERIFY_OBJECT_BEFORE_REGISTER: ${UPLOAD_VERIFY_OBJECT_BEFORE_REGISTER}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ruby -rsocket -e "socket = TCPSocket.new(''127.0.0.1'', 3000); socket.close"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - streamgate

  web:
    profiles: ["app", "full"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: streamgate-web
    restart: unless-stopped
    init: true
    working_dir: /app
    command: >
      sh -lc "
      exec pnpm dev --host 0.0.0.0 --port 5173
      "
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - streamgate

  worker:
    profiles: ["full", "worker"]
    build:
      context: ./apps/worker
      dockerfile: Dockerfile.dev
    container_name: streamgate-worker
    restart: unless-stopped
    init: true
    working_dir: /app
    command: >
      bash -lc "
      echo 'worker runtime ainda nao implementado; container mantido para smoke checks de dependencia' &&
      exec sleep infinity
      "
    volumes:
      - ./apps/worker:/app
      - worker_bundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'bundle exec ruby -e "require ''worker''"']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - streamgate

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  clickhouse_data:
  api_bundle:
  worker_bundle:
  web_node_modules:

networks:
  streamgate:
    driver: bridge
